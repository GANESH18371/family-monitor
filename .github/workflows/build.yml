name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project and add Firebase config
        run: |
          unzip -q project.zip -d app
          cp google-services.json app/parent/google-services.json
          cp google-services.json app/child/google-services.json
      - name: Build debug APKs
        working-directory: app
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/parent/build/outputs/apk/debug/*.apk
            app/child/build/outputs/apk/debug/*.apk
